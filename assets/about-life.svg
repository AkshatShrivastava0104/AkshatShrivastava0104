    <ellipse cx="835" cy="295" rx="280" ry="190" fill="url(#blueGlow)"/>
    <text x="578" y="185" class="mono" font-size="12" letter-spacing="1.8" fill="#8e9db9">01 / BUILD</text>
    <text x="578" y="233" class="sans" font-size="38" font-weight="700" fill="#f2f5ff">EventFlow</text>
    <text x="578" y="261" class="mono" font-size="12" fill="#80b5ff">EVENT REGISTRATION &amp; CHECK-IN SYSTEM</text>

    <rect x="578" y="292" width="500" height="55" rx="7" fill="#091321" stroke="#1d3553"/>
    <text x="596" y="316" class="mono" font-size="11" fill="#56779f">ARCHITECTURE</text>
    <text x="596" y="336" class="mono" font-size="13" fill="#f2f5ff">API → Go → PostgreSQL → Redis</text>

    <text x="578" y="378" class="mono" font-size="11" fill="#56779f">ENGINEERING FOCUS</text>
    <text x="578" y="402" class="mono" font-size="14" fill="#f2f5ff">RBAC • JWT • QR CHECK-IN • CACHING</text>

    <text x="578" y="441" class="mono" font-size="11" fill="#56779f">SHIP MODE</text>
    <text x="578" y="465" class="mono" font-size="14" fill="#48d597">Design → Build → Test → Deploy</text>

    <rect x="578" y="488" width="500" height="2" fill="#1c3555"/>
    <text x="578" y="512" class="mono" font-size="10" fill="#6686ae">REAL PRODUCT. REAL BOTTLENECKS. REAL LEARNING.</text>
  </g>

  <!-- slide 2 -->
  <g opacity="0">
    <animate attributeName="opacity" dur="15s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;.293;.333;.626;.667;1"/>
    <rect x="548" y="145" width="570" height="382" rx="14" fill="#0d1829" stroke="#233d61"/>
    <ellipse cx="850" cy="300" rx="285" ry="190" fill="url(#redGlow)"/>
    <text x="578" y="185" class="mono" font-size="12" letter-spacing="1.8" fill="#8e9db9">02 / SOLVE</text>
    <text x="578" y="233" class="sans" font-size="38" font-weight="700" fill="#f2f5ff">Competitive Programming</text>

    <rect x="578" y="268" width="500" height="78" rx="7" fill="#091321" stroke="#1d3553"/>
    <text x="598" y="294" class="mono" font-size="11" fill="#56779f">CURRENT SIGNAL</text>
    <text x="598" y="322" class="sans" font-size="24" font-weight="700" fill="#ff6a7b">CodeChef 4★</text>
    <text x="825" y="322" class="mono" font-size="13" fill="#a8bdd7">1843 rating</text>

    <text x="578" y="375" class="mono" font-size="11" fill="#56779f">CODEFORCES</text>
    <text x="578" y="400" class="mono" font-size="16" fill="#f2f5ff">Specialist • 1585</text>

    <text x="578" y="438" class="mono" font-size="11" fill="#56779f">THINKING STYLE</text>
    <text x="578" y="463" class="mono" font-size="14" fill="#f2f5ff">DSA • DP • GREEDY • GRAPHS • OPTIMIZATION</text>

    <text x="578" y="504" class="mono" font-size="10" fill="#6686ae">UNDERSTAND → MODEL → OPTIMIZE → ACCEPT</text>
  </g>

  <!-- slide 3 -->
  <g opacity="0">
    <animate attributeName="opacity" dur="15s" repeatCount="indefinite"
      values="0;0;0;0;1;1" keyTimes="0;.293;.333;.626;.667;1"/>
    <rect x="548" y="145" width="570" height="382" rx="14" fill="#0d1829" stroke="#233d61"/>
    <ellipse cx="850" cy="300" rx="285" ry="190" fill="url(#blueGlow)"/>
    <text x="578" y="185" class="mono" font-size="12" letter-spacing="1.8" fill="#8e9db9">03 / STACK</text>
    <text x="578" y="233" class="sans" font-size="38" font-weight="700" fill="#f2f5ff">Backend Mindset</text>

    <text x="578" y="275" class="mono" font-size="11" fill="#56779f">LANGUAGES</text>
    <text x="578" y="299" class="mono" font-size="15" fill="#f2f5ff">Go • C++ • TypeScript • JavaScript</text>

    <text x="578" y="335" class="mono" font-size="11" fill="#56779f">BACKEND</text>
    <text x="578" y="359" class="mono" font-size="15" fill="#f2f5ff">Gin • Node.js • Express • REST APIs</text>

    <text x="578" y="395" class="mono" font-size="11" fill="#56779f">DATA &amp; INFRA</text>
    <text x="578" y="419" class="mono" font-size="15" fill="#f2f5ff">PostgreSQL • Redis • Kafka • Docker</text>

    <text x="578" y="455" class="mono" font-size="11" fill="#56779f">CURRENT FOCUS</text>
    <text x="578" y="480" class="mono" font-size="14" fill="#48d597">Scalability • Security • Observability</text>

    <text x="578" y="512" class="mono" font-size="10" fill="#6686ae">LEARN THE THEORY. BUILD THE SYSTEM.</text>
  </g>
</g>

<!-- Footer -->
<path d="M82 610H1118" stroke="#1b304c"/>
<text x="82" y="632" class="mono" font-size="10" fill="#6686ae">github.com/akshat-shrivastava</text>
<text x="1118" y="632" text-anchor="end" class="mono" font-size="10" fill="#6686ae">01 / 03 • AUTO PLAY</text>
</svg>