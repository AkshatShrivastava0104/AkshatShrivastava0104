<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Akshat Kumar — Backend Developer</title>
<desc id="desc">Animated dark glass profile card for Akshat Kumar, backend developer and competitive programmer.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/>
    <stop offset="1" stop-color="#0c1728"/>
  </linearGradient>
  <radialGradient id="blueGlow">
    <stop offset="0" stop-color="#247bff" stop-opacity=".30"/>
    <stop offset="1" stop-color="#247bff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="redGlow">
    <stop offset="0" stop-color="#ff354f" stop-opacity=".20"/>
    <stop offset="1" stop-color="#ff354f" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <style>
    .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  </style>
</defs>

<!-- Background -->
<rect width="1200" height="650" fill="url(#bg)"/>
<circle cx="180" cy="110" r="250" fill="url(#blueGlow)" filter="url(#blur)"/>
<circle cx="1060" cy="560" r="260" fill="url(#redGlow)" filter="url(#blur)"/>

<!-- Header -->
<text x="74" y="76" class="mono" font-size="12" letter-spacing="2" fill="#6686ae">AKSHAT / DEVELOPER PROFILE</text>
<circle cx="1092" cy="68" r="5" fill="#48d597"/>
<text x="1108" y="73" class="mono" font-size="10" fill="#7f9bbb">OPEN TO SDE OPPORTUNITIES</text>

<!-- Main glass panel -->
<rect x="54" y="112" width="1092" height="470" rx="18" fill="#0b1627" stroke="#213a5b"/>
<rect x="55" y="113" width="1090" height="468" rx="18" fill="none" stroke="#142842"/>

<!-- Left identity -->
<rect x="82" y="145" width="430" height="382" rx="14" fill="#081321" stroke="#203b5e"/>
<circle cx="296" cy="257" r="91" fill="#0e1f35" stroke="#2b527c" stroke-width="2"/>
<circle cx="296" cy="257" r="73" fill="#102943"/>
<text x="296" y="280" text-anchor="middle" class="sans" font-size="58" font-weight="700" fill="#8dbdff">AK</text>
<circle cx="361" cy="321" r="10" fill="#48d597" stroke="#081321" stroke-width="5"/>

<text x="110" y="391" class="sans" font-size="36" font-weight="700" fill="#f2f5ff">Akshat Kumar</text>
<text x="110" y="421" class="mono" font-size="13" fill="#80b5ff">BACKEND DEVELOPER • SDE</text>
<text x="110" y="456" class="mono" font-size="12" fill="#8fa8c6">C++ • Go • Node.js • PostgreSQL</text>
<text x="110" y="480" class="mono" font-size="12" fill="#8fa8c6">Redis • Kafka • Docker • AWS</text>
<path d="M110 501H465" stroke="#233d61"/>
<text x="110" y="517" class="mono" font-size="10" letter-spacing="1.4" fill="#6686ae">BUILDING SYSTEMS THAT SCALE.</text>

<!-- Right animated slides -->
<g>
  <!-- slide 1 -->
