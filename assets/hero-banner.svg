<svg fill="none" width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.6)); }
      50% { filter: drop-shadow(0 0 18px rgba(0, 229, 255, 0.9)); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-8px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.3; }
    }
    @keyframes borderGlow {
      0%, 100% { stroke: #30363d; }
      50% { stroke: #58a6ff; }
    }

    .bg { fill: #0d1117; rx: 14px; }
    .card-border { animation: borderGlow 4s infinite ease-in-out; stroke-width: 1.5px; }
    .title { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 800; font-size: 34px; fill: #58a6ff; animation: pulseGlow 3s infinite ease-in-out; }
    .subtitle { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 600; font-size: 15px; fill: #00e5ff; letter-spacing: 0.5px; }
    .badge-bg { fill: rgba(22, 27, 34, 0.85); stroke: #30363d; stroke-width: 1px; rx: 6px; }
    .badge-text { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 12px; font-weight: 700; fill: #79c0ff; }
    
    .metric-title { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 11px; fill: #8b949e; text-anchor: middle; font-weight: 600; }
    .metric-value { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 19px; font-weight: 800; fill: #f0f6fc; text-anchor: middle; }
    
    .grid-line { stroke: rgba(48, 54, 61, 0.4); stroke-width: 1; stroke-dasharray: 4 4; }
    .particle { animation: floatParticle 4s infinite ease-in-out; }
  </style>

  <!-- Background Base -->
  <rect width="800" height="280" class="bg card-border" />

  <!-- Cyberpunk Grid Overlay -->
  <line x1="40" y1="0" x2="40" y2="280" class="grid-line" />
  <line x1="760" y1="0" x2="760" y2="280" class="grid-line" />
  <line x1="0" y1="210" x2="800" y2="210" class="grid-line" />

  <!-- Floating Glowing Nodes -->
  <circle cx="700" cy="50" r="3" fill="#00e5ff" class="particle" style="animation-delay: 0s;" />
  <circle cx="730" cy="90" r="2" fill="#58a6ff" class="particle" style="animation-delay: 1s;" />
  <circle cx="680" cy="130" r="4" fill="#3fb950" class="particle" style="animation-delay: 2s;" />

  <!-- Header Text Section -->
  <text x="50" y="62" class="title">Akshat Shrivastava</text>
  <text x="50" y="90" class="subtitle">&#9889; BACKEND ENGINEER | HIGH-THROUGHPUT &amp; DISTRIBUTED SYSTEMS</text>

  <!-- Animated Tech Stack Pills -->
  <g transform="translate(50, 110)">
    <rect width="52" height="26" class="badge-bg" stroke="#00e5ff" />
    <text x="26" y="17" class="badge-text" text-anchor="middle">Go</text>
    
    <rect x="60" width="68" height="26" class="badge-bg" />
    <text x="94" y="17" class="badge-text" text-anchor="middle">Python</text>
    
    <rect x="136" width="92" height="26" class="badge-bg" />
    <text x="182" y="17" class="badge-text" text-anchor="middle">PostgreSQL</text>
    
    <rect x="236" width="105" height="26" class="badge-bg" stroke="#3fb950" />
    <text x="288.5" y="17" class="badge-text" text-anchor="middle" fill="#3fb950">Redis Streams</text>
    
    <rect x="349" width="68" height="26" class="badge-bg" />
    <text x="383" y="17" class="badge-text" text-anchor="middle">Docker</text>

    <rect x="425" width="105" height="26" class="badge-bg" />
    <text x="477.5" y="17" class="badge-text" text-anchor="middle">Microservices</text>
  </g>

  <!-- Key Metrics Display -->
  <g transform="translate(50, 160)">
    <rect width="700" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
    
    <text x="115" y="32" class="metric-title">LEETCODE RATING</text>
    <text x="115" y="58" class="metric-value">1800+ <tspan fill="#3fb950" font-size="13px">(Knight)</tspan></text>
    <line x1="235" y1="18" x2="235" y2="62" stroke="#30363d" />

    <text x="350" y="32" class="metric-title">DSA PROBLEMS SOLVED</text>
    <text x="350" y="58" class="metric-value">1,200+</text>
    <line x1="465" y1="18" x2="465" y2="62" stroke="#30363d" />

    <text x="580" y="32" class="metric-title">CODECHEF GLOBAL RANK</text>
    <text x="580" y="58" class="metric-value">#28 <tspan fill="#e3b341" font-size="13px">(4&#9733;)</tspan></text>
  </g>
</svg>