<svg fill="none" width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes barPulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.8)); }
    }
    .bg { fill: #0d1117; rx: 12px; stroke: #30363d; stroke-width: 1.5; }
    .header { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 15px; font-weight: 800; fill: #58a6ff; letter-spacing: 1px; }
    .category { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 12px; font-weight: 700; fill: #8b949e; }
    .tag-bg { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 5px; }
    .tag-text { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 11px; font-weight: 600; fill: #c9d1d9; }
    .bar-glow { animation: barPulse 3s infinite ease-in-out; }
  </style>

  <rect width="800" height="220" class="bg" />

  <text x="40" y="38" class="header">&#9889; TECHNICAL STACK &amp; HARDWARE INTELLIGENCE</text>

  <!-- Section 1: Languages & Frameworks -->
  <text x="40" y="75" class="category">Languages &amp; Frameworks</text>
  <g transform="translate(220, 60)">
    <rect width="50" height="22" class="tag-bg" stroke="#58a6ff" /><text x="25" y="15" class="tag-text" text-anchor="middle" fill="#58a6ff">Go</text>
    <rect x="58" width="60" height="22" class="tag-bg" /><text x="88" y="15" class="tag-text" text-anchor="middle">Python</text>
    <rect x="126" width="45" height="22" class="tag-bg" /><text x="148.5" y="15" class="tag-text" text-anchor="middle">C++</text>
    <rect x="179" width="75" height="22" class="tag-bg" /><text x="216.5" y="15" class="tag-text" text-anchor="middle">JavaScript</text>
    <rect x="262" width="45" height="22" class="tag-bg" /><text x="284.5" y="15" class="tag-text" text-anchor="middle">Gin</text>
    <rect x="315" width="60" height="22" class="tag-bg" /><text x="345" y="15" class="tag-text" text-anchor="middle">FastAPI</text>
  </g>

  <!-- Section 2: Infrastructure & Monitoring -->
  <text x="40" y="115" class="category">Databases &amp; DevOps</text>
  <g transform="translate(220, 100)">
    <rect width="85" height="22" class="tag-bg" /><text x="42.5" y="15" class="tag-text" text-anchor="middle">PostgreSQL</text>
    <rect x="93" width="55" height="22" class="tag-bg" /><text x="120.5" y="15" class="tag-text" text-anchor="middle">Redis</text>
    <rect x="156" width="70" height="22" class="tag-bg" /><text x="191" y="15" class="tag-text" text-anchor="middle">MongoDB</text>
    <rect x="234" width="60" height="22" class="tag-bg" /><text x="264" y="15" class="tag-text" text-anchor="middle">Docker</text>
    <rect x="302" width="75" height="22" class="tag-bg" /><text x="339.5" y="15" class="tag-text" text-anchor="middle">Azure VM</text>
    <rect x="385" width="85" height="22" class="tag-bg" /><text x="427.5" y="15" class="tag-text" text-anchor="middle">Prometheus</text>
    <rect x="478" width="60" height="22" class="tag-bg" /><text x="508" y="15" class="tag-text" text-anchor="middle">Grafana</text>
  </g>

  <!-- Section 3: System Concepts & Hardware -->
  <text x="40" y="155" class="category">Core &amp; Robotics</text>
  <g transform="translate(220, 140)">
    <rect width="110" height="22" class="tag-bg" /><text x="55" y="15" class="tag-text" text-anchor="middle">REST API Design</text>
    <rect x="118" width="95" height="22" class="tag-bg" /><text x="165.5" y="15" class="tag-text" text-anchor="middle">Microservices</text>
    <rect x="221" width="90" height="22" class="tag-bg" /><text x="266" y="15" class="tag-text" text-anchor="middle">Concurrency</text>
    <rect x="319" width="140" height="22" class="tag-bg" stroke="#00e5ff" class="bar-glow" /><text x="389" y="15" class="tag-text" text-anchor="middle" fill="#00e5ff">Autonomous Drones</text>
    <rect x="467" width="95" height="22" class="tag-bg" stroke="#3fb950" /><text x="514.5" y="15" class="tag-text" text-anchor="middle" fill="#3fb950">3D Printing</text>
  </g>
</svg>