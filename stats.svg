<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280">
  <defs>
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0014"/>
      <stop offset="50%" stop-color="#160329"/>
      <stop offset="100%" stop-color="#08000f"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <linearGradient id="innerRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ff2a85"/>
    </linearGradient>

    <linearGradient id="statsBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <linearGradient id="statSweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="statsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="statsCardClip">
      <rect width="520" height="280" rx="16"/>
    </clipPath>
  </defs>

  <style>
    /* Robust animations: base values are already at final state so it NEVER appears empty */
    .stat-row {
      animation: rowSlideIn 0.6s ease-out forwards;
    }
    @keyframes rowSlideIn {
      0% { opacity: 0; transform: translateX(14px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    .sweep-bar {
      animation: sweepAnim 5s ease-in-out infinite;
    }
    @keyframes sweepAnim {
      0% { transform: translateX(-400px) skewX(-20deg); }
      30% { transform: translateX(700px) skewX(-20deg); }
      100% { transform: translateX(700px) skewX(-20deg); }
    }
  </style>

  <g clip-path="url(#statsCardClip)">
    <!-- Card Background -->
    <rect width="520" height="280" fill="url(#statsBg)"/>
    
    <!-- Background Cyber Grid lines -->
    <path d="M 0 50 L 520 50 M 0 110 L 520 110 M 0 170 L 520 170 M 0 230 L 520 230" stroke="rgba(139, 92, 246, 0.08)" stroke-width="1"/>
    
    <!-- Card Header -->
    <g transform="translate(24, 30)">
      <circle cx="0" cy="-4" r="4.5" fill="#ff2a85" filter="url(#statsGlow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="12" y="0" fill="#ffffff" font-size="14" font-weight="800" font-family="-apple-system, sans-serif" letter-spacing="1">ENGINEERING &amp; CP METRICS</text>
      <text x="470" y="0" fill="#a78bfa" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace" text-anchor="end">LOCAL // VERIFIED</text>
      <line x1="0" y1="12" x2="472" y2="12" stroke="rgba(255, 42, 133, 0.3)" stroke-width="1"/>
    </g>

    <!-- Circular Rank Gauges (Left side) -->
    <g transform="translate(85, 145)">
      <!-- Outer Track (Radius 46, Circumference = 289) -->
      <circle cx="0" cy="0" r="46" fill="none" stroke="rgba(139, 92, 246, 0.2)" stroke-width="7"/>
      <!-- Outer Progress Circle: CF 1585 / Specialist (~80% = 58 offset) -->
      <circle cx="0" cy="0" r="46" fill="none" stroke="url(#ringGrad)" stroke-width="7" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="58" transform="rotate(-90)" filter="url(#statsGlow)">
        <animate attributeName="stroke-dashoffset" from="289" to="58" dur="1.8s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      </circle>

      <!-- Inner Track (Radius 34, Circumference = 213) -->
      <circle cx="0" cy="0" r="34" fill="none" stroke="rgba(245, 158, 11, 0.15)" stroke-width="5"/>
      <!-- Inner Progress Circle: CC 1843 / 4-star (~85% = 32 offset) -->
      <circle cx="0" cy="0" r="34" fill="none" stroke="url(#innerRingGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="213" stroke-dashoffset="32" transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset" from="213" to="32" dur="1.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      </circle>
      
      <!-- Center Display -->
      <text x="0" y="-7" fill="#ffffff" font-size="12" font-weight="800" font-family="-apple-system, sans-serif" text-anchor="middle">TOP</text>
      <text x="0" y="10" fill="#ff2a85" font-size="17" font-weight="900" font-family="'JetBrains Mono', monospace" text-anchor="middle">5%</text>
      <text x="0" y="23" fill="#a78bfa" font-size="8" font-weight="700" font-family="-apple-system, sans-serif" text-anchor="middle">PERCENTILE</text>

      <!-- Sub-badge -->
      <rect x="-44" y="58" width="88" height="18" rx="9" fill="rgba(255, 42, 133, 0.25)" stroke="#ff2a85" stroke-width="1"/>
      <text x="0" y="70" fill="#ff2a85" font-size="9" font-weight="800" font-family="'JetBrains Mono', monospace" text-anchor="middle">SPECIALIST</text>
    </g>

    <!-- Stat Rows (Right side) -->
    <g transform="translate(175, 68)">
      <!-- Row 1: Codeforces -->
      <g class="stat-row" style="animation-delay: 0.2s;" transform="translate(0, 16)">
        <rect width="320" height="38" rx="8" fill="rgba(26, 6, 51, 0.75)" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1"/>
        <circle cx="16" cy="19" r="5" fill="#3b82f6"/>
        <text x="30" y="23" fill="#ffffff" font-size="11.5" font-weight="700" font-family="-apple-system, sans-serif">Codeforces Specialist</text>
        <text x="305" y="23" fill="#38bdf8" font-size="11.5" font-weight="800" font-family="'JetBrains Mono', monospace" text-anchor="end">Rating: 1585</text>
      </g>

      <!-- Row 2: CodeChef -->
      <g class="stat-row" style="animation-delay: 0.4s;" transform="translate(0, 62)">
        <rect width="320" height="38" rx="8" fill="rgba(26, 6, 51, 0.75)" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1"/>
        <circle cx="16" cy="19" r="5" fill="#f59e0b"/>
        <text x="30" y="23" fill="#ffffff" font-size="11.5" font-weight="700" font-family="-apple-system, sans-serif">CodeChef 4★ Contender</text>
        <text x="305" y="23" fill="#fbbf24" font-size="11.5" font-weight="800" font-family="'JetBrains Mono', monospace" text-anchor="end">Rating: 1843</text>
      </g>

      <!-- Row 3: Backend & Architecture -->
      <g class="stat-row" style="animation-delay: 0.6s;" transform="translate(0, 108)">
        <rect width="320" height="38" rx="8" fill="rgba(26, 6, 51, 0.75)" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1"/>
        <circle cx="16" cy="19" r="5" fill="#ec4899"/>
        <text x="30" y="23" fill="#ffffff" font-size="11.5" font-weight="700" font-family="-apple-system, sans-serif">Backend Architecture</text>
        <text x="305" y="23" fill="#ec4899" font-size="11.5" font-weight="800" font-family="'JetBrains Mono', monospace" text-anchor="end">Distributed / 98%</text>
      </g>

      <!-- Row 4: AWS Certification -->
      <g class="stat-row" style="animation-delay: 0.8s;" transform="translate(0, 154)">
        <rect width="320" height="38" rx="8" fill="rgba(26, 6, 51, 0.75)" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1"/>
        <circle cx="16" cy="19" r="5" fill="#10b981"/>
        <text x="30" y="23" fill="#ffffff" font-size="11.5" font-weight="700" font-family="-apple-system, sans-serif">AWS Cloud Engineer</text>
        <text x="305" y="23" fill="#10b981" font-size="11.5" font-weight="800" font-family="'JetBrains Mono', monospace" text-anchor="end">Certified</text>
      </g>
    </g>

    <!-- Continuous Periodic Light Sweep -->
    <rect x="0" y="0" width="160" height="280" fill="url(#statSweepGrad)" class="sweep-bar"/>

    <!-- Border -->
    <rect width="520" height="280" rx="16" fill="none" stroke="url(#statsBorderGrad)" stroke-width="1.6"/>
  </g>
</svg>