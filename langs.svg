<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280">
  <defs>
    <linearGradient id="langsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0014"/>
      <stop offset="50%" stop-color="#140226"/>
      <stop offset="100%" stop-color="#08000f"/>
    </linearGradient>

    <linearGradient id="langsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff2a85"/>
    </linearGradient>

    <linearGradient id="langsSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="langsCardClip">
      <rect width="520" height="280" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .langs-sweep {
      animation: sweepLangs 5.5s ease-in-out infinite;
    }
    @keyframes sweepLangs {
      0% { transform: translateX(-400px) skewX(-20deg); }
      30% { transform: translateX(700px) skewX(-20deg); }
      100% { transform: translateX(700px) skewX(-20deg); }
    }
  </style>

  <g clip-path="url(#langsCardClip)">
    <rect width="520" height="280" fill="url(#langsBg)"/>

    <path d="M 0 50 L 520 50 M 0 110 L 520 110 M 0 170 L 520 170 M 0 230 L 520 230" stroke="rgba(139, 92, 246, 0.08)" stroke-width="1"/>

    <g transform="translate(24, 30)">
      <circle cx="0" cy="-4" r="4.5" fill="#8b5cf6">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="12" y="0" fill="#ffffff" font-size="14" font-weight="800" font-family="-apple-system, sans-serif" letter-spacing="1">CORE SKILL &amp; LANGUAGE MATRIX</text>
      <text x="470" y="0" fill="#a78bfa" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace" text-anchor="end">EXPERTISE WEIGHT</text>
      <line x1="0" y1="12" x2="472" y2="12" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>
    </g>

    <g transform="translate(24, 66)">
      
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#ffffff" font-size="11.5" font-weight="700" font-family="-apple-system, sans-serif">C++</text>
        <text x="95" y="14" fill="#a78bfa" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">32%</text>
        <text x="460" y="14" fill="#9ca3af" font-size="10" font-weight="500" font-family="-apple-system, sans-serif" text-anchor="end">CP & Core Systems</text>

        <!-- Progress Track -->
        <rect x="135" y="5" width="220" height="10" rx="5" fill="rgba(139, 92, 246, 0.18)"/>
        
        <!-- Animated Bar Fill (Default set to full width so it is never empty) -->
        <rect x="135" y="5" width="210" height="10" rx="5" fill="#ff2a85">
          <animate attributeName="width" from="0" to="210" dur="1.4s" begin="0.20s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        </rect>
        
        <!-- Glowing head dot -->
        <circle cx="345" cy="10" r="3" fill="#ffffff">
          <animate attributeName="cx" from="135" to="345" dur="1.4s" begin="0.20s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        </circle>
      </g>
    
      <g transform="translate(0, 36)">
        <text x="0" y="14" fill="#ffffff" font-size="11.5" font-weight="700" font-family="-apple-system, sans-serif">Go</text>
        <text x="95" y="14" fill="#a78bfa" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">26%</text>
        <text x="460" y="14" fill="#9ca3af" font-size="10" font-weight="500" font-family="-apple-system, sans-serif" text-anchor="end">Microservices & Concurrency</text>

        <!-- Progress Track -->
        <rect x="135" y="5" width="220" height="10" rx="5" fill="rgba(139, 92, 246, 0.18)"/>
        
        <!-- Animated Bar Fill (Default set to full width so it is never empty) -->
        <rect x="135" y="5" width="172" height="10" rx="5" fill="#00f0ff">
          <animate attributeName="width" from="0" to="172" dur="1.4s" begin="0.30s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        </rect>
        
        <!-- Glowing head dot -->
        <circle cx="307" cy="10" r="3" fill="#ffffff">
          <animate attributeName="cx" from="135" to="307" dur="1.4s" begin="0.30s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        </circle>
      </g>
    
      <g transform="translate(0, 72)">
        <text x="0" y="14" fill="#ffffff" font-size="11.5" font-weight="700" font-family="-apple-system, sans-serif">TypeScript</text>
        <text x="95" y="14" fill="#a78bfa" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">20%</text>
        <text x="460" y="14" fill="#9ca3af" font-size="10" font-weight="500" font-family="-apple-system, sans-serif" text-anchor="end">Scalable APIs & Fullstack</text>

        <!-- Progress Track -->
        <rect x="135" y="5" width="220" height="10" rx="5" fill="rgba(139, 92, 246, 0.18)"/>
        
        <!-- Animated Bar Fill (Default set to full width so it is never empty) -->
        <rect x="135" y="5" width="135" height="10" rx="5" fill="#8b5cf6">
          <animate attributeName="width" from="0" to="135" dur="1.4s" begin="0.40s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        </rect>
        
        <!-- Glowing head dot -->
        <circle cx="270" cy="10" r="3" fill="#ffffff">
          <animate attributeName="cx" from="135" to="270" dur="1.4s" begin="0.40s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        </circle>
      </g>
    
      <g transform="translate(0, 108)">
        <text x="0" y="14" fill="#ffffff" font-size="11.5" font-weight="700" font-family="-apple-system, sans-serif">JavaScript</text>
        <text x="95" y="14" fill="#a78bfa" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">12%</text>
        <text x="460" y="14" fill="#9ca3af" font-size="10" font-weight="500" font-family="-apple-system, sans-serif" text-anchor="end">Node.js & Express Ecosystem</text>

        <!-- Progress Track -->
        <rect x="135" y="5" width="220" height="10" rx="5" fill="rgba(139, 92, 246, 0.18)"/>
        
        <!-- Animated Bar Fill (Default set to full width so it is never empty) -->
        <rect x="135" y="5" width="84" height="10" rx="5" fill="#f59e0b">
          <animate attributeName="width" from="0" to="84" dur="1.4s" begin="0.50s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        </rect>
        
        <!-- Glowing head dot -->
        <circle cx="219" cy="10" r="3" fill="#ffffff">
          <animate attributeName="cx" from="135" to="219" dur="1.4s" begin="0.50s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        </circle>
      </g>
    
      <g transform="translate(0, 144)">
        <text x="0" y="14" fill="#ffffff" font-size="11.5" font-weight="700" font-family="-apple-system, sans-serif">SQL / DBs</text>
        <text x="95" y="14" fill="#a78bfa" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">10%</text>
        <text x="460" y="14" fill="#9ca3af" font-size="10" font-weight="500" font-family="-apple-system, sans-serif" text-anchor="end">PostgreSQL & Redis Caching</text>

        <!-- Progress Track -->
        <rect x="135" y="5" width="220" height="10" rx="5" fill="rgba(139, 92, 246, 0.18)"/>
        
        <!-- Animated Bar Fill (Default set to full width so it is never empty) -->
        <rect x="135" y="5" width="68" height="10" rx="5" fill="#10b981">
          <animate attributeName="width" from="0" to="68" dur="1.4s" begin="0.60s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        </rect>
        
        <!-- Glowing head dot -->
        <circle cx="203" cy="10" r="3" fill="#ffffff">
          <animate attributeName="cx" from="135" to="203" dur="1.4s" begin="0.60s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        </circle>
      </g>
    
    </g>

    <g transform="translate(24, 256)">
      <text x="0" y="0" fill="#6b7280" font-size="9" font-family="-apple-system, sans-serif">
        * Self-curated representative skill weighting across CP problem-solving &amp; production backend engineering.
      </text>
    </g>

    <rect x="0" y="0" width="160" height="280" fill="url(#langsSweep)" class="langs-sweep"/>
    <rect width="520" height="280" rx="16" fill="none" stroke="url(#langsBorder)" stroke-width="1.6"/>
  </g>
</svg>